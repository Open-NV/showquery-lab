[project]
name = "showquery"
version = "0.1.0"
description = "Query daily network show-command snapshots in MongoDB with SQL via osquery, plus a no-SQL query builder UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "osquery>=3.1",
  "pymongo>=4.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
showquery-extension = "showquery.extension:main"
showquery-seed = "showquery.seed:main"
showquery-api = "showquery.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the running stack (scripts/stack.sh up)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
